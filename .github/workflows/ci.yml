name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 checks
    runs-on: ubuntu-latest
    env:
      PYTHON_DOTENV_DISABLED: "1"
      DEMO_MODE: "true"
      AI_PROVIDER: ""
      OPENAI_API_KEY: ""
      FEATHERLESS_API_KEY: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.lock

      - name: Install pinned dependencies and test tools
        run: python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Check dependency consistency
        run: python -m pip check

      - name: Ruff correctness checks
        run: python -m ruff check .

      - name: Unit and integration tests
        run: python -m pytest -q --junitxml=junit.xml

      - name: Coverage
        run: >-
          python -m pytest --cov=ai --cov=commerce --cov=paypal_checkout --cov=web
          --cov-report=term-missing --cov-report=xml --junitxml=coverage-junit.xml -q

      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.lock

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-evidence
          path: |
            junit.xml
            coverage-junit.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 14
