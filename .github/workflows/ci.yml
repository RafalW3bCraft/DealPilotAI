name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dealpilot
          POSTGRES_PASSWORD: ephemeral-test-password
          POSTGRES_DB: dealpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealpilot -d dealpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHON_DOTENV_DISABLED: "1"
      DEMO_MODE: "true"
      AI_PROVIDER: ""
      OPENAI_API_KEY: ""
      FEATHERLESS_API_KEY: ""
      TEST_POSTGRES_URL: postgresql://dealpilot:ephemeral-test-password@127.0.0.1:5432/dealpilot_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.lock

      - name: Install pinned dependencies and test tools
        run: python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Check dependency consistency
        run: python -m pip check

      - name: Ruff correctness checks
        run: python -m ruff check .

      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium

      - name: Tests and coverage
        run: >-
          python -m pytest --cov=ai --cov=commerce --cov=paypal_checkout --cov=web
          --cov-fail-under=80
          --cov-report=term-missing --cov-report=xml --junitxml=junit.xml -q

      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.lock

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-evidence
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 14
